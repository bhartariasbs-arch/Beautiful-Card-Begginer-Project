<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'poppins', sans-serif;
        }

        body {
            height: 100vh;
            width: auto;
            background-color: rgb(222, 219, 219);
        }

        .parent {
            background-color: white;
            width: 355px;
            height: 525px;
            border-radius: 20px;
            border: 2px solid rgb(182, 182, 182);
            margin: 25px auto;
            box-shadow: 0px 0px 10px rgb(124, 124, 124);
        }

        img {
            width: 346.5px;
            height: 250px;
            padding: 5px;
            margin: 3px;

            border-radius: 20px;
        }

        span {
            color: rgb(124, 124, 124);
            padding: 5px;
            margin: 3px;
            font-weight: 600;
            border: 1px solid rgb(214, 210, 210);
            border-radius: 20px;
            font-size: 14px;
        }

        .parent p {
            margin: 2px auto;
            padding: 5px;
            color: rgb(104, 102, 102);
            text-shadow: 0px 0px 1px rgb(104, 102, 102) ;
        }

        .parent h1 {
            margin: 2px auto;
            padding: 5px;
            text-shadow: 0px 0px 1.5px black;
        }

        .readMore {
            margin: 5px;
            padding: 5px;
            border: none;
            width: 125px;
            height: 40px;
            border-radius: 20px;
            position: relative;
            top: 10px;
            left: 100px;
            color: rgb(7, 135, 220);
            font-weight: 600;
            background-color: rgb(176, 206, 239);
            box-shadow: 0px 0px 20px rgb(161, 200, 242);
            
        }
        .readMore:hover{
            color: rgb(0, 76, 255);
            background-color: rgb(145, 145, 232);
            width: 130px;
            height: 45px;
            transition: 0.2s background, color ease-in-out;
        }
    </style>
    <div class="container">
        <div class="parent">
            <img src="https://media.istockphoto.com/id/1208877516/photo/old-man-and-the-sea.jpg?s=612x612&w=0&k=20&c=uehCCP7wTeem0mD90LXCgbDb5kRwCOcAXq8UB4_Li7M="
                alt="">
            <span class="nature">Nature</span>
            <span class="boating">Boating</span>
            <h1>Beautiful Lake</h1>
            <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Ad, quibusdam voluptatem consequuntur non
                obcaecati facilis!</p>
            <button class="readMore">Read More</button>
        </div>
    </div>
</body>

</html>
